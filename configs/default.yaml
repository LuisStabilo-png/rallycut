# Configuração padrão do rallycut.
# Valores por modalidade (quadra/praia) sobrescrevem os de "geral".
# Os valores de margem e limiar são provisórios: serão calibrados na Fase 1/2.

geral:
  proxy:
    altura: 480          # altura do proxy de análise (px)
    fps: 8               # fps do proxy de análise
    usar_nvdec: true     # decodificar o bruto na GPU (cuda); cai para CPU se falhar
  audio:
    taxa_hz: 16000       # taxa de amostragem do áudio extraído (mono)
  saida:
    altura: 1080         # resolução de saída
    fps: null            # null = manter o fps do bruto
    codec: h264_nvenc
    preset: p5           # p1 (rápido) .. p7 (melhor qualidade)
    cq: 23               # qualidade constante (menor = melhor)
    audio_codec: aac
    audio_bitrate: 160k
  janela:
    tamanho_s: 0.5       # janela de features (s)
  cortes:                # detecção de cortes em vídeos editados (Fase 1)
    largura: 256         # resolução da passada de cortes (cinza)
    altura: 144
    janela_z_s: 2.0      # janela da mediana/MAD local
    piso_visual: 0.0005  # piso do denominador do z visual
    piso_audio: 0.05     # piso do denominador do z de áudio
    janelas_audio: 5     # nº de janelas de 10 ms comparadas antes/depois do ponto
    visual_min: 8.0      # z visual mínimo para virar candidato
    visual_alta: 20.0    # z visual para confiança alta/média
    audio_confirma: 5.0  # z de áudio que confirma um corte visual
    audio_solo: 15.0     # z de áudio para candidato só-áudio (confiança baixa)
    tolerancia_audio_s: 0.08
    distancia_min_s: 1.0 # distância mínima entre cortes

quadra:
  margem_pre_s: 2.0      # tempo mantido antes do saque (provisório)
  margem_pos_s: 1.5      # tempo mantido após o fim do ponto (provisório)
  duracao_min_rally_s: 3.0
  uniao_gap_s: 2.0       # une trechos separados por menos que isso
  peso_audio: 1.0

praia:
  margem_pre_s: 2.5
  margem_pos_s: 1.5
  duracao_min_rally_s: 3.0
  uniao_gap_s: 2.0
  peso_audio: 0.5        # áudio menos confiável (vento e ruído)
