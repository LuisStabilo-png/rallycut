# Configuração padrão do rallycut.
# Valores por modalidade (quadra/praia) sobrescrevem os de "geral".
# Os valores de margem e limiar são provisórios: serão calibrados na Fase 1/2.

geral:
  proxy:
    altura: 480          # altura do proxy de análise (px)
    fps: 8               # fps do proxy de análise
    usar_nvdec: true     # decodificar o bruto na GPU (cuda); cai para CPU se falhar
  audio:
    taxa_hz: 16000       # taxa de amostragem do áudio extraído (mono)
  saida:
    altura: 1080         # resolução de saída
    fps: null            # null = manter o fps do bruto
    codec: h264_nvenc
    preset: p5           # p1 (rápido) .. p7 (melhor qualidade)
    cq: 23               # qualidade constante (menor = melhor)
    audio_codec: aac
    audio_bitrate: 160k
  janela:
    tamanho_s: 0.5       # janela de features (s)
  features:              # extração de features por janela (detecção de jogadores)
    altura: 720          # resolução decodificada para detectar jogadores (largura 16:9); 360 = versão antiga
  alinhamento:           # alinhamento bruto <-> editado
    fps: 10              # amostragem dos frames comparados (memória cresce com fps²)
    largura: 128
    altura: 72
    salto: 3.0           # custo de um salto no bruto (corte); maior = menos trechos
    janela_audio_s: 0.4  # correção máxima do deslocamento pelo áudio
  cortes:                # detecção de cortes em vídeos editados (Fase 1)
    largura: 256         # resolução da passada de cortes (cinza)
    altura: 144
    janela_z_s: 2.0      # janela da mediana/MAD local
    piso_visual: 0.0005  # piso do denominador do z visual
    piso_audio: 0.05     # piso do denominador do z de áudio
    janelas_audio: 5     # nº de janelas de 10 ms comparadas antes/depois do ponto
    visual_min: 8.0      # z visual mínimo para virar candidato
    fracao_min: 0.02     # fração mínima de pixels alterados (escala absoluta); cortes reais
                         # ficaram em ~5-9%, falsos em ~1% nos vídeos de teste
    visual_alta: 20.0    # z visual para confiança alta/média
    audio_confirma: 5.0  # z de áudio que confirma um corte visual
    verificacao:         # 2ª etapa: continuidade dos jogadores (torchvision), decide o corte
      usar: true         # candidatos permissivos (abaixo) + decisão pelos jogadores
      visual_min: 4.0    # candidatos: z visual mínimo (bem mais permissivo que o padrão)
      fracao_min: 0.01   # candidatos: fração mínima de pixels alterados
      continuidade_min: 0.06   # perto_med mínimo: jogadores próximos da câmera "teletransportaram"
      fracao_forte: 0.10       # ou: >= 10% dos pixels mudaram (corte óbvio)
      continuidade_alta: 0.15  # perto_med para confiança alta
    tolerancia_audio_s: 0.08
    distancia_min_s: 1.0 # distância mínima entre cortes
  deteccao:              # detector: probabilidade por janela -> rallies
    limiar: 0.4          # probabilidade mínima de "rally" (menor = mais recall, mais tempo morto)
    histerese: 1.0       # o rally abre em `limiar` e se estende até limiar*histerese (1 = sem histerese)
    suavizar_s: 3.0      # mediana móvel da probabilidade
    uniao_gap_s: 8.0     # une rallies separados por menos que isso (tempo morto real >= ~15 s)
    duracao_min_s: 3.0   # descarta trechos mais curtos
    margem_pre_s: 1.5    # folga antes do início detectado (nunca perder o saque)
    margem_pos_s: 1.5    # folga depois do fim detectado

  revisao:               # app de revisão (app/revisar.py)
    contexto_antes_s: 8.0  # quanto do vídeo antes do início do rally o player mostra (vê o saque entrar)
    contexto_depois_s: 3.0
    piso_lacuna: 0.15    # pico (média de 3 s) mínimo da probabilidade para listar um vazio como rally perdido
    max_lacunas: 30
    duracao_min_s: 1.0   # menor rally aceito ao ajustar ou adicionar
    proxy_altura: 480    # proxy para assistir no app
    proxy_fps: 30

quadra:
  deteccao:           # calibrado para o TCN com bola (scripts/calibrar_limiar.py, 9 pares, jogo de fora):
    limiar: 0.40      # ~97% dos inícios (pior par 94%) com a saída em ~1,8x o gabarito
    margem_pre_s: 4.0

praia:
  deteccao:           # idem: ~97% dos inícios (pior par 95%) com a saída em ~2,3x o gabarito
    limiar: 0.25
    margem_pre_s: 4.0
