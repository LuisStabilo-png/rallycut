[project]
name = "rallycut"
version = "0.1.0"
description = "Corte automático de rallies em vídeos de vôlei (quadra e praia) com câmera fixa"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "opencv-python>=4.10",
    "tqdm>=4.66",
    "gradio>=5.0",
    "torch",
    "torchvision",
]

[build-system]
requires = ["uv_build>=0.10.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
